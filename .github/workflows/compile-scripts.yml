name: Compile AutoHotkey Scripts

on:
  push:
    branches: [ main, master ]
    paths:
      - 'source-scripts/**'
      - '.github/workflows/compile-scripts.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'source-scripts/**'
      - '.github/workflows/compile-scripts.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AutoHotkey v2 via Chocolatey
        shell: pwsh
        run: |
          Write-Host "Installing AutoHotkey v2 via Chocolatey..."
          choco install autohotkey.install -y

          Write-Host "`n=== Installation complete! ==="
          Write-Host "`nListing ALL installed files in AutoHotkey directory:"
          Get-ChildItem "C:\Program Files\AutoHotkey" -Recurse | ForEach-Object {
            Write-Host "  $($_.FullName)"
          }

          Write-Host "`n=== Searching for compiler-related files ==="
          $compilerFiles = Get-ChildItem "C:\Program Files\AutoHotkey" -Recurse -Include "*2exe*","*compile*","*ahk2*" -ErrorAction SilentlyContinue

          if ($compilerFiles) {
            Write-Host "Found potential compiler files:"
            $compilerFiles | ForEach-Object { Write-Host "  $($_.FullName)" }
          } else {
            Write-Host "No obvious compiler files found"
          }

          Write-Host "`n=== Searching for .exe files ==="
          Get-ChildItem "C:\Program Files\AutoHotkey" -Recurse -Filter "*.exe" | ForEach-Object {
            Write-Host "  $($_.FullName)"
          }

      - name: Create output directory
        run: New-Item -ItemType Directory -Force -Path compiled-scripts
        shell: pwsh

      - name: Compile all scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path "source-scripts" -Filter "*.ahk" -Recurse

          if ($scripts.Count -eq 0) {
            Write-Error "No .ahk scripts found in source-scripts directory!"
            exit 1
          }

          Write-Host "Found $($scripts.Count) script(s) to compile`n"

          foreach ($script in $scripts) {
            $scriptName = $script.BaseName
            $outputExe = "compiled-scripts\$scriptName.exe"

            Write-Host "Compiling $($script.Name)..."

            & ahk2exe.exe /silent verbose /in $script.FullName /out $outputExe

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to compile $($script.Name)"
              exit 1
            }

            Write-Host "  -> Successfully created $outputExe"
          }

          Write-Host "`nCompilation complete! Compiled scripts:"
          Get-ChildItem -Path "compiled-scripts" | ForEach-Object {
            Write-Host "  - $($_.Name) ($([math]::Round($_.Length / 1KB, 2)) KB)"
          }

      - name: Upload compiled scripts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-scripts
          path: compiled-scripts/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: compiled-scripts/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
