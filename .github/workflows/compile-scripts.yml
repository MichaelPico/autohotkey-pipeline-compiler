name: Compile AutoHotkey Scripts

on:
  push:
    branches: [ main, master ]
    paths:
      - 'source-scripts/**'
      - '.github/workflows/compile-scripts.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'source-scripts/**'
      - '.github/workflows/compile-scripts.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AutoHotkey v2 via Chocolatey
        shell: pwsh
        run: |
          Write-Host "Installing AutoHotkey v2 via Chocolatey..."
          choco install autohotkey.install -y

          Write-Host "`nInstallation complete!"

      - name: Download and Install Ahk2Exe Compiler
        shell: pwsh
        run: |
          Write-Host "Downloading Ahk2Exe compiler from GitHub..."

          # Download the latest Ahk2Exe release from GitHub
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest"
          $zipAsset = $releases.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1

          if (-not $zipAsset) {
            Write-Error "Could not find Ahk2Exe zip file in latest release"
            exit 1
          }

          Write-Host "Found: $($zipAsset.name)"
          Write-Host "Downloading from: $($zipAsset.browser_download_url)"

          $zipPath = "$env:TEMP\Ahk2Exe.zip"
          Invoke-WebRequest -Uri $zipAsset.browser_download_url -OutFile $zipPath

          Write-Host "Download complete. Extracting..."

          # Create Compiler directory
          $compilerPath = "C:\Program Files\AutoHotkey\Compiler"
          New-Item -ItemType Directory -Force -Path $compilerPath | Out-Null

          # Extract the zip
          Expand-Archive -Path $zipPath -DestinationPath $compilerPath -Force

          Write-Host "Extraction complete. Verifying installation..."

          # Check for Ahk2Exe.exe
          if (Test-Path "$compilerPath\Ahk2Exe.exe") {
            Write-Host "SUCCESS: Ahk2Exe.exe installed at $compilerPath"

            # Add compiler to PATH
            echo "$compilerPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            # List all files in compiler directory
            Write-Host "`nCompiler directory contents:"
            Get-ChildItem $compilerPath | ForEach-Object { Write-Host "  - $($_.Name)" }
          } else {
            Write-Error "Ahk2Exe.exe not found after extraction!"
            Write-Host "Compiler directory contents:"
            Get-ChildItem $compilerPath | ForEach-Object { Write-Host "  - $($_.Name)" }
            exit 1
          }

      - name: Create output directory
        run: New-Item -ItemType Directory -Force -Path compiled-scripts
        shell: pwsh

      - name: Compile all scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path "source-scripts" -Filter "*.ahk" -Recurse

          if ($scripts.Count -eq 0) {
            Write-Error "No .ahk scripts found in source-scripts directory!"
            exit 1
          }

          Write-Host "Found $($scripts.Count) script(s) to compile`n"

          # Specify the base file for v2 compilation (64-bit)
          $baseFile = "C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe"

          if (-not (Test-Path $baseFile)) {
            Write-Error "Base file not found: $baseFile"
            exit 1
          }

          Write-Host "Using base file: $baseFile`n"

          foreach ($script in $scripts) {
            $scriptName = $script.BaseName
            $outputExe = Join-Path (Get-Location) "compiled-scripts\$scriptName.exe"

            Write-Host "Compiling $($script.Name)..."
            Write-Host "  Output path: $outputExe"

            & ahk2exe.exe /silent verbose /in $script.FullName /out $outputExe /base $baseFile

            # Wait a moment for file to be written
            Start-Sleep -Milliseconds 500

            # Check if the output file was created (more reliable than exit code)
            if (Test-Path $outputExe) {
              $fileSize = (Get-Item $outputExe).Length
              Write-Host "  -> Successfully created $outputExe ($([math]::Round($fileSize / 1KB, 2)) KB)"
            } else {
              Write-Error "Failed to compile $($script.Name) - output file not created at $outputExe"
              Write-Host "Checking compiled-scripts directory contents:"
              Get-ChildItem "compiled-scripts" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  - $($_.FullName)" }
              exit 1
            }
          }

          Write-Host "`nCompilation complete! Compiled scripts:"
          Get-ChildItem -Path "compiled-scripts" | ForEach-Object {
            Write-Host "  - $($_.Name) ($([math]::Round($_.Length / 1KB, 2)) KB)"
          }

      - name: Upload compiled scripts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-scripts
          path: compiled-scripts/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: compiled-scripts/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
