name: Compile AutoHotkey Scripts

on:
  push:
    branches: [ main, master ]
    paths:
      - 'source-scripts/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'source-scripts/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AutoHotkey
        shell: pwsh
        run: |
          $cwd = (Get-Item .).FullName
          $ahkVersion = "2.0.18"
          $downloadUrl = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$ahkVersion/AutoHotkey_$ahkVersion.zip"

          Write-Host "Downloading AutoHotkey v$ahkVersion from GitHub..."
          Invoke-WebRequest -Uri $downloadUrl -OutFile "$cwd\autohotkey.zip" -UserAgent "Mozilla/5.0"

          Write-Host "Extracting AutoHotkey..."
          Expand-Archive -Path "$cwd\autohotkey.zip" -DestinationPath "$cwd\_autohotkey\" -Force
          Remove-Item -Path "$cwd\autohotkey.zip" -Force

          Write-Host "Checking extracted files..."
          Get-ChildItem -Path "$cwd\_autohotkey\" -Recurse | Select-Object FullName | Format-Table -AutoSize

          Write-Host "Setting up environment paths..."
          Write-Output ("$cwd\_autohotkey\;" + "$cwd\_autohotkey\Compiler") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host "Configuring compiler..."
          # Check if the bin file exists, if not, look for alternatives
          $binFile = Get-ChildItem -Path "$cwd\_autohotkey\" -Filter "*.bin" -Recurse | Select-Object -First 1
          if ($binFile) {
            Write-Host "Found bin file: $($binFile.FullName)"
            Copy-Item -Path $binFile.FullName -Destination "$cwd\_autohotkey\Compiler\AutoHotkeySC.bin" -Force
          } else {
            Write-Host "No .bin file found, compiler will use default"
          }

          Write-Host "AutoHotkey setup complete!"

      - name: Create output directory
        run: New-Item -ItemType Directory -Force -Path compiled-scripts
        shell: pwsh

      - name: Compile all scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path "source-scripts" -Filter "*.ahk" -Recurse

          if ($scripts.Count -eq 0) {
            Write-Error "No .ahk scripts found in source-scripts directory!"
            exit 1
          }

          Write-Host "Found $($scripts.Count) script(s) to compile`n"

          foreach ($script in $scripts) {
            $scriptName = $script.BaseName
            $outputExe = "compiled-scripts\$scriptName.exe"

            Write-Host "Compiling $($script.Name)..."

            & ahk2exe.exe /silent verbose /in $script.FullName /out $outputExe

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to compile $($script.Name)"
              exit 1
            }

            Write-Host "  -> Successfully created $outputExe"
          }

          Write-Host "`nCompilation complete! Compiled scripts:"
          Get-ChildItem -Path "compiled-scripts" | ForEach-Object {
            Write-Host "  - $($_.Name) ($([math]::Round($_.Length / 1KB, 2)) KB)"
          }

      - name: Upload compiled scripts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-scripts
          path: compiled-scripts/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: compiled-scripts/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
