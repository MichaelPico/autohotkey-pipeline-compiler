name: Compile AutoHotkey Scripts

on:
  push:
    branches: [ main, master ]
    paths:
      - 'source-scripts/**'
      - '.github/workflows/compile-scripts.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'source-scripts/**'
      - '.github/workflows/compile-scripts.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AutoHotkey v2 via Chocolatey
        shell: pwsh
        run: |
          Write-Host "Installing AutoHotkey v2 via Chocolatey..."
          choco install autohotkey.install -y

          Write-Host "`nInstallation complete!"

      - name: Install Ahk2Exe Compiler
        shell: pwsh
        run: |
          Write-Host "Running install-ahk2exe.ahk to download and install the compiler..."

          $installScript = "C:\Program Files\AutoHotkey\UX\install-ahk2exe.ahk"
          $autohotkeyExe = "C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe"

          # Run the installer script with /install flag to skip GUI and auto-install
          & $autohotkeyExe $installScript /install

          Write-Host "`nWaiting for installation to complete..."
          Start-Sleep -Seconds 5

          Write-Host "`nChecking for Ahk2Exe.exe..."
          $compilerPath = "C:\Program Files\AutoHotkey\Compiler"

          if (Test-Path "$compilerPath\Ahk2Exe.exe") {
            Write-Host "SUCCESS: Ahk2Exe.exe found at $compilerPath\Ahk2Exe.exe"

            # Add compiler to PATH
            echo "$compilerPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            # List all files in compiler directory
            Write-Host "`nCompiler directory contents:"
            Get-ChildItem $compilerPath | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Error "Ahk2Exe.exe not found after installation!"
            Write-Host "Checking if Compiler directory exists..."
            if (Test-Path $compilerPath) {
              Write-Host "Directory exists, contents:"
              Get-ChildItem $compilerPath | ForEach-Object { Write-Host "  $($_.Name)" }
            } else {
              Write-Host "Compiler directory does not exist at $compilerPath"
            }
            exit 1
          }

      - name: Create output directory
        run: New-Item -ItemType Directory -Force -Path compiled-scripts
        shell: pwsh

      - name: Compile all scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path "source-scripts" -Filter "*.ahk" -Recurse

          if ($scripts.Count -eq 0) {
            Write-Error "No .ahk scripts found in source-scripts directory!"
            exit 1
          }

          Write-Host "Found $($scripts.Count) script(s) to compile`n"

          foreach ($script in $scripts) {
            $scriptName = $script.BaseName
            $outputExe = "compiled-scripts\$scriptName.exe"

            Write-Host "Compiling $($script.Name)..."

            & ahk2exe.exe /silent verbose /in $script.FullName /out $outputExe

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to compile $($script.Name)"
              exit 1
            }

            Write-Host "  -> Successfully created $outputExe"
          }

          Write-Host "`nCompilation complete! Compiled scripts:"
          Get-ChildItem -Path "compiled-scripts" | ForEach-Object {
            Write-Host "  - $($_.Name) ($([math]::Round($_.Length / 1KB, 2)) KB)"
          }

      - name: Upload compiled scripts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-scripts
          path: compiled-scripts/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: compiled-scripts/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
